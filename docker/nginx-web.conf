# Edge proxy for docker-compose: static React app under /ui, API on upstream.
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    # Multipart uploads (workspace PDF/MD/TXT); raise if users still hit 413.
    client_max_body_size 128m;

    location = /favicon.ico {
        return 302 /ui/favicon.svg;
    }

    # Vite build (base: /ui/)
    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
    }

    location ~ ^/v1/ingest/jobs/[^/]+/events$ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
