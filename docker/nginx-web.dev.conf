server {
    listen 80;
    server_name _;
    # Docker Compose may assign a new IP to `api` / `ui` after recreate; nginx otherwise
    # caches the old address at startup → 502 "Host is unreachable". Re-resolve periodically.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Multipart uploads (workspace PDF/MD/TXT); raise if users still hit 413.
    client_max_body_size 128m;

    location = / {
        return 307 /ui/;
    }

    location = /favicon.ico {
        return 302 /ui/favicon.svg;
    }

    # Vite dev server (HMR + module requests) under the same /ui base as production.
    location /ui/ {
        set $ui_upstream ui;
        proxy_pass http://$ui_upstream:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/v1/ingest/jobs/[^/]+/events$ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v2/agent/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else stays on the API service: /health, /v1/*, /docs, /legacy/*, etc.
    location / {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
