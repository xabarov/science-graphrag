services:
  neo4j:
    image: neo4j:5-community
    env_file:
      - .env
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      NEO4J_AUTH: ${SCIENCE_GRAPHRAG_NEO4J_USER:-neo4j}/${SCIENCE_GRAPHRAG_NEO4J_PASSWORD:-change-me}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7474"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-science}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-science_graphrag}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-science} -d ${POSTGRES_DB:-science_graphrag}"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "16333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  phoenix:
    # Override in `.env` for deterministic builds, e.g.:
    # SCIENCE_GRAPHRAG_PHOENIX_IMAGE=arizephoenix/phoenix@sha256:<digest>
    image: ${SCIENCE_GRAPHRAG_PHOENIX_IMAGE:-arizephoenix/phoenix:latest}
    ports:
      - "16006:6006"
      - "14317:4317"
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "science_graphrag.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8787",
        "--reload",
      ]
    expose:
      - "8787"
    ports:
      - "18787:8787"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      # Let Compose URLs win over a developer `.env` that targets localhost-published ports.
      SCIENCE_GRAPHRAG_SKIP_HOST_DOTENV: "1"
      # Keep DB credentials in sync with the postgres service defaults/.env values.
      SCIENCE_GRAPHRAG_DATABASE_URL: ${SCIENCE_GRAPHRAG_DATABASE_URL_DOCKER:-postgresql+psycopg://${POSTGRES_USER:-science}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-science_graphrag}}
      SCIENCE_GRAPHRAG_NEO4J_URI: bolt://neo4j:7687
      SCIENCE_GRAPHRAG_NEO4J_USER: ${SCIENCE_GRAPHRAG_NEO4J_USER:-neo4j}
      SCIENCE_GRAPHRAG_NEO4J_PASSWORD: ${SCIENCE_GRAPHRAG_NEO4J_PASSWORD:-change-me}
      SCIENCE_GRAPHRAG_QDRANT_URL: http://qdrant:6333
      SCIENCE_GRAPHRAG_REDIS_URL: redis://redis:6379/0
      SCIENCE_GRAPHRAG_AGENT_SESSION_MEMORY_BACKEND: redis
      # Live E1 (corpus_explore / research_plan): override from host when recreating api, e.g.
      # `SCIENCE_GRAPHRAG_AGENT_CORPUS_EXPLORE_ENABLED=1 SCIENCE_GRAPHRAG_AGENT_RESEARCH_PLAN_SUBAGENT_ENABLED=1 docker compose up -d api --force-recreate`
      SCIENCE_GRAPHRAG_AGENT_CORPUS_EXPLORE_ENABLED: ${SCIENCE_GRAPHRAG_AGENT_CORPUS_EXPLORE_ENABLED:-0}
      SCIENCE_GRAPHRAG_AGENT_RESEARCH_PLAN_SUBAGENT_ENABLED: ${SCIENCE_GRAPHRAG_AGENT_RESEARCH_PLAN_SUBAGENT_ENABLED:-0}
      # Opt-in per shell: `SCIENCE_GRAPHRAG_AGENT_TOOL_USE_SUMMARY_ENABLED=1 docker compose up -d api`
      SCIENCE_GRAPHRAG_AGENT_TOOL_USE_SUMMARY_ENABLED: ${SCIENCE_GRAPHRAG_AGENT_TOOL_USE_SUMMARY_ENABLED:-0}
      # Optional override for live E2 acceptance probing (default stays production-like).
      SCIENCE_GRAPHRAG_AGENT_TOOL_USE_SUMMARY_MIN_PAYLOAD_CHARS: ${SCIENCE_GRAPHRAG_AGENT_TOOL_USE_SUMMARY_MIN_PAYLOAD_CHARS:-6000}
      SCIENCE_GRAPHRAG_BLOB_ROOT: /data/blobs
      SCIENCE_GRAPHRAG_ARTIFACT_ROOT: /data/artifacts
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      SCIENCE_GRAPHRAG_S3_ENDPOINT_URL: http://minio:9000
      SCIENCE_GRAPHRAG_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      SCIENCE_GRAPHRAG_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SCIENCE_GRAPHRAG_S3_BUCKET: science-raw
      SCIENCE_GRAPHRAG_S3_USE_SSL: "false"
    volumes:
      - .:/app
      # Host PDF tree mounted at /data/blobs. Set SCIENCE_GRAPHRAG_HOST_BLOB_MOUNT=./data/blobs_merged in .env after rsync merge (ingest-corpus runbook).
      - ${SCIENCE_GRAPHRAG_HOST_BLOB_MOUNT:-./data/blobs}:/data/blobs
      - ./data/artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  ui:
    image: node:20-bookworm-slim
    working_dir: /app/ui
    # Named volume ui_node_modules: see ui/docker-entrypoint-dev.sh for lockfile-driven npm ci.
    command: ["sh", "/app/ui/docker-entrypoint-dev.sh"]
    expose:
      - "5173"
    volumes:
      - ./ui:/app/ui
      - ui_node_modules:/app/ui/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/ui/').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    ports:
      - "8787:80"
    volumes:
      - ./docker/nginx-web.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["python", "-m", "science_graphrag.worker"]
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      # Dramatiq defaults to many processes (noisy boot logs); override here or pass CLI args.
      SCIENCE_GRAPHRAG_DRAMATIQ_PROCESSES: "1"
      SCIENCE_GRAPHRAG_SKIP_HOST_DOTENV: "1"
      SCIENCE_GRAPHRAG_DATABASE_URL: ${SCIENCE_GRAPHRAG_DATABASE_URL_DOCKER:-postgresql+psycopg://${POSTGRES_USER:-science}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-science_graphrag}}
      SCIENCE_GRAPHRAG_NEO4J_URI: bolt://neo4j:7687
      SCIENCE_GRAPHRAG_NEO4J_USER: ${SCIENCE_GRAPHRAG_NEO4J_USER:-neo4j}
      SCIENCE_GRAPHRAG_NEO4J_PASSWORD: ${SCIENCE_GRAPHRAG_NEO4J_PASSWORD:-change-me}
      SCIENCE_GRAPHRAG_QDRANT_URL: http://qdrant:6333
      SCIENCE_GRAPHRAG_REDIS_URL: redis://redis:6379/0
      SCIENCE_GRAPHRAG_BLOB_ROOT: /data/blobs
      SCIENCE_GRAPHRAG_ARTIFACT_ROOT: /data/artifacts
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      SCIENCE_GRAPHRAG_S3_ENDPOINT_URL: http://minio:9000
      SCIENCE_GRAPHRAG_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      SCIENCE_GRAPHRAG_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SCIENCE_GRAPHRAG_S3_BUCKET: science-raw
      SCIENCE_GRAPHRAG_S3_USE_SSL: "false"
    volumes:
      - .:/app
      - ${SCIENCE_GRAPHRAG_HOST_BLOB_MOUNT:-./data/blobs}:/data/blobs
      - ./data/artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  neo4j_data:
  pg_data:
  qdrant_data:
  phoenix_data:
  redis_data:
  minio_data:
  ui_node_modules:
