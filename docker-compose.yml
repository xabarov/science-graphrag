# Local stack for Phase 1. Usage: docker compose up -d
# Host ports chosen to avoid clashes with existing Postgres (5432) / Neo4j (7474, 7687) on the machine.
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      NEO4J_AUTH: neo4j/sciencegraphrag
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: science
      POSTGRES_PASSWORD: science
      POSTGRES_DB: science_graphrag
    volumes:
      - pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "16333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "16006:6006"
      - "14317:4317"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  neo4j_data:
  pg_data:
  qdrant_data:
  phoenix_data:
