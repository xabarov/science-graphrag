            - heading "3 Methodology" [level=2] [ref=e9084]
            - paragraph [ref=e9085]: "Based on our theoretical analysis, we identify three fundamental challenges in existing methods: (1) SC suffers from slow Estimation Error convergence, leading to efficiency concerns; (2) PPL exhibits large Model Error, compromising its effectiveness; (3) PPL’s Estimation Error convergence advantage deteriorates significantly for certain cases, resulting in a degradation issue."
            - paragraph [ref=e9086]:
              - text: To address these challenges, we propose
              - emphasis [ref=e9087]: Reasoning-Pruning Perplexity Consistency
              - text: (RPC), a novel method with two key components. First, we integrate internal LLM probabilities into the self-consistency framework to create
              - emphasis [ref=e9088]: Perplexity Consistency
              - text: (PC), a confidence estimation function that reduces estimation error efficiently while maintaining low model error, thus addressing the first two challenges with theoretical guarantees. Second, we introduce a
              - emphasis [ref=e9089]: Reasoning Pruning
              - text: (RP) module that resolves the third challenge by systematically filtering out reasoning paths with low probabilities.
