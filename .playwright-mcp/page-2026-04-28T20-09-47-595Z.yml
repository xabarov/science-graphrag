              - text: "1, \\ldots, \\tilde{t}_n$ for estimating the confidence $\\hat{p}^{(\\mathrm{PC})}$ and we omit the details of expectation for simplicity. To simplify the analysis, we assume that each $\\tilde{t}_1, \\ldots, \\tilde{t}_n$ is different from each other, which is a reasonable assumption in practical LLM reasoning and slightly affects the value of $n$ if this assumption is not satisfied. For any given answer $\\hat{y}$, the estimated probability of PC is $\\hat{p}(\\hat{y} \\mid x) = \\sum_{i=1}^n \\mathbb{I}[g(\\tilde{t}_i) = \\hat{y}] p(\\tilde{t}_i \\mid x)$, allowing the reasoning error of PC can be computed as follows. $$ \\mathcal{E}_{\\hat{p}^{(\\mathrm{PC})}}(\\hat{y}) = \\mathbb{E}\\left[\\left(\\hat{p}^{(\\mathrm{PC})}(\\hat{y} \\mid x) - \\mathbb{I}[\\hat{y} = y]\\right)^2\\right] $$ $$ = \\mathbb{E}\\left[\\left(\\hat{p}^{(\\mathrm{PC})}(\\hat{y} \\mid x) - p(\\hat{y} \\mid x) + p(\\hat{y} \\mid x) - \\mathbb{I}[\\hat{y} = y]\\right)^2\\right]. $$ We define $k := |\\{\\tilde{t} \\mid g(\\tilde{t}) = \\hat{y}\\}|$, which means that how many reasoning paths whose answers are $\\hat{y}$ can be covered given limited sampling budget. Note that we further have $\\mathbb{E}[\\mathbb{I}[g(\\tilde{t}) = \\hat{y}] p(\\tilde{t} \\mid x)] = \\frac{1}{k} p(\\hat{y} \\mid x)$, thus $$ \\mathbb{E}[\\hat{p}^{(\\mathrm{PC})}(\\hat{y} \\mid x)] = \\mathbb{E}\\left[\\sum_{i=1}^n \\mathbb{I}[g(\\tilde{t}_i) = \\hat{y}] p(\\tilde{t}_i \\mid x)\\right] $$ $$ = \\left(1 - \\left(1 - \\frac{1}{k} p(\\hat{y} \\mid x)\\right)^n\\right) p(\\hat{y} \\mid x) $$ $$ = (1 - \\alpha^n) p(\\hat{y} \\mid x), $$ where $\\alpha := 1 - \\frac{1}{k} p(\\hat{y} \\mid x)$. Again, we have $$ \\mathbb{E}[\\hat{p}^{(\\mathrm{PC})}(\\hat{y} \\mid x) - p(\\hat{y} \\mid x)] = -\\left(1 - \\alpha\\right)^n p(\\hat{y} \\mid x) $$ $$ \\mathbb{E}[\\left(\\hat{p}^{(\\mathrm{PC})}(\\hat{y} \\mid x) - p(\\hat{y} \\mid x)\\right)^2] = \\left(1 - \\left(1 - \\alpha\\right)^n\\right) \\left(1 - \\alpha\\right)^n p(\\hat{y} \\mid x)^2 $$ Hence, $$ \\mathcal{E}"
