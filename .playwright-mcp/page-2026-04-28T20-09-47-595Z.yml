            - paragraph [ref=e7710]:
              - strong [ref=e7711]: Remark 1.
              - text: "The detailed proof is provided in Appendix A.1. Proposition 1 separates the effect of confidence estimation on reasoning error from the effect of the LLM’s reasoning capability. The Estimation Error depends solely on the sampling size and the confidence estimation strategy, while the Model Error is invariant and determined by the LLM’s reasoning capability. This proposition demonstrates that, apart from the fixed Model Error, which is determined by the LLM’s inherent reasoning capability, the reasoning error is bounded by the Estimation Error. Moreover, this proposition provides insights into two directions for improving LLM reasoning performance: (1) reducing the Estimation Error through larger sampling sizes or more accurate confidence estimation methods, and (2) reducing the Model Error by enhancing the LLM’s reasoning capabilities or developing more sophisticated and effective confidence metrics."
