            - paragraph [ref=e10928]: RPC and our Perplexity Consistency module (denoted as PC), we report the minimum number of samples needed to match or exceed the performance of the SC in Table 1.
            - paragraph [ref=e10929]: The results of PC indicate improved convergence rates compared to SC in several cases, while maintaining similar rates in others. These findings support the rapid convergence and degradation issues of PC in Theorem 4. RPC shows significant efficiency improvements by requiring fewer samples to achieve comparable performance relative to SC. Moreover, the degradation issues observed in PC are effectively addressed in RPC, validating both the effectiveness of the Reasoning Pruning module and our Theorem 7.
            - paragraph [ref=e10930]:
              - strong [ref=e10931]: "RQ2: Efficacy."
              - text: How does RPC improve reasoning performance compared to existing methods?
            - paragraph [ref=e10932]: We evaluate the performance of PC and RPC in Figure 2 across various sample budgets. The results demonstrate that RPC achieves better performance than both PPL (which relies on internal LLM probabilities) and SC (which employs Monte Carlo sampling). The detailed accuracy results, including mean and standard deviation in Table 2 support these findings.
            - paragraph [ref=e10933]: We also analyze the performance of PC separately. The results indicate that PC has a faster convergence rate than SC, which aligns with Theorem 4. The significant performance gains from PC to RPC, as shown in Figure 2a and Figure 2b validate the effectiveness of the Reasoning Pruning module. This suggests that Reasoning Pruning helps reduce model errors when the LLM exhibits good alignment by eliminating incorrect reasoning paths that carry low LLM probability scores.
            - paragraph [ref=e10934]:
              - strong [ref=e10935]: "RQ3: Reliability."
              - text: How does RPC enhance the reliability of confidence estimation compared to existing methods?
            - paragraph [ref=e10936]: To evaluate the reliability of confidence estimation, we analyze the ECE results of RPC and comparison methods in Table 2. ECE measures the difference between predicted probabilities and empirical accuracy, as directly computing estimation error using ground-truth probabilities is virtually impractical. The results demonstrate that our RPC approach achieves lower ECE values and higher accuracy compared to PPL and SC, indicating more reliable confidence estimation. We visualize this improvement through reliability diagrams comparing SC and RPC in Figure 3 on MathOdyssey, which clearly shows the reduced calibration error of RPC.
