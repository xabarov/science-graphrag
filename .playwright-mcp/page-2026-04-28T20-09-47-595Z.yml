              - text: "{\\hat{p}^{(\\mathrm{RPC})}}(\\hat{y}) = \\underbrace{\\alpha p(\\hat{y} \\mid x) \\left(2\\mathbb{I}[\\hat{y} = y] - (1 + \\alpha) p(\\hat{y} \\mid x)\\right) \\mathbb{I}[(p(\\hat{y}) \\mid x) < \\tau]}_{\\text{Estimation Error}} + \\underbrace{\\left(p(\\hat{y} \\mid x) - \\mathbb{I}[\\hat{y}_i = y]\\right)^2 \\mathbb{I}[(p(\\hat{y}) \\mid x) < \\tau]}_{\\text{Model Error}} $$ However, we only have an estimation of $p(\\hat{y} \\mid x)$, i.e., $\\hat{p}^{(\\mathrm{RPC})}(\\hat{y} \\mid x) = k \\mathbb{E}\\left[\\mathbb{I}[g(\\tilde{t}) = \\hat{y}] p(\\tilde{t} \\mid x)\\right] \\approx \\frac{k}{\\hat{k}} \\sum_{i=1}^{\\hat{k}} p(\\tilde{t}_i \\mid x)$, where $\\tilde{t}_1, \\ldots, \\tilde{t}_{\\hat{k}}$ are $\\hat{k}$ sampled reasoning paths whose answer is $\\hat{y}$. Therefore, the reasoning error of our approximate version can be computed by $$ \\mathcal{E}_{\\hat{p}^{(\\mathrm{RPC})}}(\\hat{y}) = \\underbrace{\\alpha(p) p(\\hat{y} \\mid x) \\left(2\\mathbb{I}[\\hat{y} = y] - (1 + \\alpha(p)) p(\\hat{y} \\mid x)\\right) \\mathbb{I}\\left[\\frac{1}{\\hat{k}} \\sum_{i=1}^{\\hat{k}} p(\\tilde{t}_i \\mid x) < \\frac{1}{m} \\tau\\right]}_{\\text{Estimation Error}} + \\underbrace{\\left(p(\\hat{y} \\mid x) - \\mathbb{I}[\\hat{y}_i = y]\\right)^2 \\mathbb{I}\\left[\\frac{1}{\\hat{k}} \\sum_{i=1}^{\\hat{k}} p(\\tilde{t}_i \\mid x) < \\frac{1}{m} \\tau\\right]}_{\\text{Model Error}} $$ Hence, we only need to consider the probability $\\frac{1}{\\hat{k}} \\sum_{i=1}^{\\hat{k}} p(\\tilde{t}_i \\mid x) > \\frac{1}{m} \\tau$. Using Hoeffding’s inequality, we can obtain that $$ \\mathbb{P}\\left(\\frac{1}{\\hat{k}} \\sum_{i=1}^{\\hat{k}} p(\\tilde{t}_i \\mid x) - \\frac{1}{\\hat{k}} p(\\hat{y} \\mid x) \\geq \\tau\\right) \\leq \\exp\\left(-\\frac{2\\hat{k}\\gamma^2}{p(\\hat{y} \\mid x)^2}\\right) $$ We set $\\gamma = \\tau - \\frac{1}{\\hat{k}} p(\\hat{y} \\mid x) = \\tau + \\alpha - 1$, then $$ \\mathbb{P}\\left(\\frac{1}{\\hat{k}} \\sum_{i=1}^{\\hat{k}} p(\\tilde{t}_i \\mid x) \\geq \\tau\\right) \\leq \\exp\\left(-2\\hat{k}k^2(1 - \\frac{\\tau}{1 - \\alpha})^2\\right). $$ Hence, we complete the proof. $\\square$"
