specific reasoning problems. The proof is presented as follows. **Proof.** We first recall the definitions of the model error for self-consistency and perplexity: $\\left\\{\\begin{array}{l} \\mathcal{E}_{\\text {Model }}^{(\\mathrm{SC})}=\\sum_{\\hat{y} \\in\\left\\{g\\left(\\tilde{t}_{i}\\right) \\mid i=1 \\ldots n\\right\\}}\\left(\\hat{p}^{(\\mathrm{SC})}(\\hat{y} \\mid x)-\\mathbb{I}[\\hat{y}=y]\\right)^{2}, \\\\ \\mathcal{E}_{\\text {Model }}^{(\\mathrm{PPL})}=\\sum_{\\hat{t} \\in \\mathcal{R}}\\left(\\hat{p}^{(\\mathrm{PPL})}(\\hat{t} \\mid x)-\\mathbb{I}[g(\\hat{t})=y]\\right)^{2} . \\end{array}\\right.$ where $\\mathcal{R}=\\operatorname{Set}\\left(\\tilde{t}_{1}, \\ldots, \\tilde{t}_{n}\\right)$ is the set of reasoning paths sampled from the LLM. We can compute the difference between the model error of SC and PPL as follows: $\\begin{aligned} \\mathcal{E}_{\\text {Model }}^{(\\mathrm{SC})}-\\mathcal{E}_{\\text {Model }}^{(\\mathrm{PPL})} &= \\sum_{\\hat{y} \\in\\left\\{g\\left(\\tilde{t}_{i}\\right) \\mid i=1 \\ldots n\\right\\}}\\left(\\hat{p}^{(\\mathrm{SC})}(\\hat{y} \\mid x)-\\mathbb{I}[\\hat{y}=y]\\right)^{2}-\\sum_{\\hat{t} \\in \\mathcal{R}}\\left(\\hat{p}^{(\\mathrm{PPL})}(\\hat{t} \\mid x)-\\mathbb{I}[g(\\hat{t})=y]\\right)^{2} \\\\ &= \\sum_{\\hat{y} \\in\\left\\{g\\left(\\tilde{t}_{i}\\right) \\mid i=1 \\ldots n\\right\\}}\\left[\\left(\\hat{p}^{(\\mathrm{SC})}(\\hat{y} \\mid x)-\\mathbb{I}[\\hat{y}=y]\\right)^{2}-\\sum_{\\hat{t} \\in \\mathcal{R}} \\mathbb{I}[g(\\hat{t})=\\hat{y}]\\left(\\hat{p}^{(\\mathrm{PPL})}(\\hat{t} \\mid x)-\\mathbb{I}[\\hat{y}=y]\\right)^{2}\\right] \\end{aligned}$ Assuming infinite samplings, the unbiasedness of SC gives us: $\\hat{p}^{(\\mathrm{SC})}(\\hat{y} \\mid x)=\\frac{1}{n} \\sum_{i=1}^{n} \\mathbb{I}\\left[g\\left(\\tilde{t}_{i}\\right)=\\hat{y}\\right]=\\sum_{\\hat{t} \\in \\mathcal{R}} \\mathbb{I}[g(\\hat{t})=\\hat{y}] \\cdot \\hat{p}^{(\\mathrm{PPL})}(\\hat{t} \\mid x)$ For any $\\hat{y}$, consider two case