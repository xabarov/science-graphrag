              - text: The experimental results show that our RPC achieves the best performance.
            - paragraph [ref=e10944]: methods on three code generation benchmarks, as illustrated in Figure 4. The results show that RPC achieves the highest accuracy across all datasets, demonstrating its effectiveness beyond mathematics.
            - paragraph [ref=e10945]:
              - strong [ref=e10946]: Performance on Additional Reasoning Tasks.
              - text: To further validate the effectiveness of RPC, we conducted experiments on the GPQA [47] and LogiQA [39] benchmarks using the DeepSeek-R1-Distill-Qwen-7B model [21] with 16 samples. The results in Appendix D.5 are consistent with those from both math reasoning and code generation tasks, where RPC outperforms existing methods.
            - paragraph [ref=e10947]:
              - strong [ref=e10948]: Performance across Model Scales and Architectures.
              - text: To evaluate the generalization ability of our approaches across different model scales and architectures, we conducted additional experiments using InternLM2-Math-Plus 1.8B and DeepSeek-Math models. The results in Table 3 is consistent with results in Table 2. We additionally report the detailed performance of InternLM2-Math-Plus 1.8B using diverse sampling budgets in Appendix D.2. The experimental results demonstrate the effectiveness of RPC across different model scales and architectures.
            - paragraph [ref=e10949]:
              - strong [ref=e10950]: Performance using Advanced Methods and Models.
              - text: "To further verify the effectiveness of RPC across diverse scenarios, we conduct additional experiments using the DeepSeek-R1-Distill-Qwen-7B model [21], which is an advanced model with thinking capability. The results in Appendix D.4 demonstrate that the performance gains of RPC persist when combined with advanced models that have strong reasoning performance, highlighting its potential for enhancing LLM reasoning capability. Moreover, we also combine RPC with two advanced methods: ESC [36] and BoN using the reward model [68], which are advanced versions of SC and PPL, respectively. The results in Appendix D.4 show that RPC applied to both methods consistently outperforms the SC and their original versions, demonstrating its strong compatibility for integration with more advanced methods."
            - paragraph [ref=e10951]:
              - strong [ref=e10952]: Performance using High Sampling Temperatures.
              - text: As discussed above, sampling more diverse reasoning paths is important for improving reasoning performance. Therefore, we additionally conduct experiments under high sampling temperatures. As shown in Appendix D.1, RPC can further improve reasoning performance under high sampling temperatures by benefiting from the diverse reasoning paths, while the SC may deteriorate due to increased estimation errors at high temperatures.
            - paragraph [ref=e10953]:
              - strong [ref=e10954]: Discussion about Computational Overhead.
              - text: We discuss the computational overhead of RPC in Appendix D.7. Theoretically, RPC introduces only minimal computational overhead compared to SC. In practice, the additional computational overhead of RPC is negligible compared to the primary computational bottleneck (i.e., LLM inference time) in reasoning tasks. RPC actually provides an excellent computational trade-off, where the minimal computational overhead is exchanged for significant time savings achieved by reducing the number of required LLM inferences.
            - paragraph [ref=e10955]:
              - strong [ref=e10956]: Discussion about Hyper-parameters.
              - text: We provide a detailed discussion of the hyperparameters in Appendix D.6. Overall, RPC introduces the RP module to automatically prune reasoning paths with low probability without requiring manual threshold setting. This makes RPC a hyperparameter-free method that is robust across diverse reasoning tasks.
            - heading "5 Related Work" [level=2] [ref=e10957]
            - paragraph [ref=e10958]: This paper is related to the two topics, i.e., LLM Reasoning Boosting and LLM Confidence Estimation.
            - paragraph [ref=e10959]:
              - strong [ref=e10960]: LLM Reasoning Boosting.
              - text: Recent research has developed various methods to improve LLM reasoning capabilities. CoT [31] proposes the “Let’s think step by step” prompt to guide LLMs in generating
