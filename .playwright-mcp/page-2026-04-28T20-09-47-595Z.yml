            - heading "4.1 Experimental Setting" [level=3] [ref=e10748]
            - paragraph [ref=e10749]: In this section, we briefly introduce the comparison methods, datasets, and implementation details. Due to space limitations, detailed experimental settings are included in Appendix C.
            - paragraph [ref=e10750]:
              - strong [ref=e10751]: Comparison Methods.
              - text: "We compare three types of LLM confidences: perplexity confidence [57] (PPL), self-consistency confidence [10] (SC), and verbalized confidence [52] (VERB). The verbalized confidence is computed based on the probability that the LLM outputs “True” versus “False” when asked an “Is-True” question. For code generation tasks, we extracted verbalized confidence scores from the model’s numerical likelihood expressions by prompting the LLM."
            - paragraph [ref=e10752]:
              - strong [ref=e10753]: Datasets.
              - text: "We introduce four popular benchmarks for math reasoning: MATH [25], MathOdyssey [16], OlympiadBench [23], and AIME [66] (contains problems from 1983 to 2024). As to code generation tasks, we evaluate each method on three benchmarks, i.e., HumanEval [8], MBPP [3], and introductory-level problems of APPS [24]."
