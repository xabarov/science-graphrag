            - heading "Abstract" [level=2] [ref=e6611]
            - paragraph [ref=e6612]:
              - text: Test-time scaling seeks to improve the reasoning performance of large language models (LLMs) by adding computational resources. A prevalent approach within the field is
              - emphasis [ref=e6613]: sampling-based test-time scaling methods
              - text: ", which enhance reasoning by generating multiple reasoning paths for a given input during inference. However, despite its practical success, the theoretical foundations remain underexplored. In this paper, we provide the first theoretical framework for analyzing sampling-based test-time scaling methods, grounded in the perspective of confidence estimation. Based on the framework, we analyze two dominant paradigms: self-consistency and perplexity, and reveal key limitations: self-consistency suffers from high estimation error while perplexity exhibits substantial modeling error and possible degradation of the estimation error convergence. To address these limitations, we introduce RPC, a hybrid method that leverages our theoretical insights through two key components:"
              - emphasis [ref=e6614]: Perplexity Consistency
              - text: and
              - emphasis [ref=e6615]: Reasoning Pruning
              - text: . Perplexity Consistency combines the strengths of self-consistency and perplexity, boosting the convergence rate of estimation error from linear to exponential while preserving model error. Reasoning Pruning prevents degradation by eliminating low-probability reasoning paths. Both theoretical analysis and empirical results across seven benchmark datasets demonstrate that RPC has a strong potential for reducing reasoning error. Notably, RPC achieves reasoning performance comparable to self-consistency while not only enhancing confidence reliability but also reducing sampling costs by 50%. The code and resources are available at
              - link "https://wnjxyk.github.io/RPC" [ref=e6616] [cursor=pointer]:
                - /url: https://wnjxyk.github.io/RPC
            - heading "1 Introduction" [level=2] [ref=e6617]
            - paragraph [ref=e6618]: Recent advances in large language models (LLMs) have demonstrated their remarkable reasoning capabilities across diverse applications, including problem-solving [33, 35], planning [53, 13], and decision-making [45, 48]. Test-time scaling methods [58, 57, 20] can further enhance reasoning performance with additional computation. Among these strategies, the sampling-based test-time scaling method has emerged as a simple yet effective technique. Through generating multiple reasoning paths and selecting the most plausible one through a confidence estimation mechanism, such as self-consistency [57] and perplexity [10], this approach has achieved significant improvements.
            - paragraph [ref=e6619]:
              - text: "The success of sampling-based test-time scaling hinges on accurately estimating the confidence of sampled reasoning paths, facilitating their comparison and enabling the selection of the most plausible answer in the Best-of-N manner [20, 29]. Current confidence estimation approaches can be categorized into two main types: (i)"
              - emphasis [ref=e6620]: consistency-based methods
              - text: ", which use pre-defined consistency functions [11] to determine answer confidence, with self-consistency as the primary representative; and (ii)"
              - emphasis [ref=e6621]: probability-based methods
              - text: ", which utilize scores from either the internal LLM probability [44] or external model [29] to evaluate the confidence of reasoning paths, with perplexity as the leading example. While both have proven effective in practice, a rigorous theoretical understanding remains lacking regarding their underlying mechanisms, inherent limitations, and potential improvements."
            - paragraph [ref=e6622]:
              - text: "This paper addresses this gap by introducing the first theoretical framework for sampling-based test-time scaling methods in LLM reasoning. Within this framework, reasoning error is decomposed into two components:"
              - emphasis [ref=e6623]: Estimation Error
              - text: and
              - emphasis [ref=e6624]: Model Error
              - text: ". We apply our framework to analyze two representative methods from each category, self-consistency and perplexity, and identify their limitations. Self-consistency, which relies on Monte Carlo estimation, achieves only a linear convergence rate in estimation error, resulting in unsatisfactory performance when the sampling budget is limited. Perplexity utilizes the internal probabilities of LLMs to achieve exponential convergence rates, but they suffer from high model error, which compromises their effectiveness. Moreover, its convergence rate depends on the magnitude of probabilities and deteriorates significantly when probabilities are low. These insights provide guidance for developing improved methods: An optimal approach should simultaneously achieve rapid estimation error convergence while maintaining low model error."
            - paragraph [ref=e6625]:
              - text: To address the above limitations, we introduce a novel
              - emphasis [ref=e6626]: Reasoning-pruning Perplexity Consistency
              - text: "(RPC) method, which consists of two components:"
              - emphasis [ref=e6627]: Perplexity Consistency
              - text: and
              - emphasis [ref=e6628]: Reasoning Pruning
              - text: .
              - emphasis [ref=e6629]: Perplexity Consistency
              - text: integrates the internal probability of the LLM into the self-consistency framework, enabling rapid estimation error reduction that transitions from linear to exponential convergence while maintaining low model error.
              - emphasis [ref=e6630]: Reasoning Pruning
              - text: mitigates the degradation issue of estimation error reduction rate when the internal LLM probability magnitude is low by automatically modeling the probability distribution and removing low-probability reasoning paths. Our theoretical analysis shows that RPC achieves both fast estimation error convergence and low model error, offering significant potential to reduce reasoning error. Our empirical results demonstrate the effectiveness and efficiency of RPC on seven benchmark datasets. Specifically, on four mathematical reasoning datasets, RPC reduces the required sampling budget by at least 50% while maintaining the same level of reasoning performance as self-consistency. When using the same sampling budget, RPC achieves an average improvement of 1.29% over existing methods. Additionally, RPC provides confidence estimates that are more closely aligned with the ground truth compared to existing methods.
            - paragraph [ref=e6631]: "To summarize, the main contributions of the paper are:"
            - paragraph [ref=e6632]: (1) We propose a theoretical framework that formulates sampling-based test-time scaling in LLM reasoning and decomposes reasoning error into estimation error and model error. This framework enables an analysis of existing techniques, offering guidance for developing improved approaches.
            - paragraph [ref=e6633]: (2) Based on this framework, we introduce a novel test-time scaling method, RPC, which leverages the internal probability of LLMs within the self-consistency paradigm and removes low-probability reasoning paths, thereby accelerating error reduction and improving reasoning performance.
            - paragraph [ref=e6634]: (3) Our theoretical analysis demonstrates that RPC achieves rapid estimation error convergence, providing strong potential for reducing reasoning error. Empirical results on seven benchmark datasets show that RPC substantially reduces the required sampling budget, improves reasoning accuracy, and enhances the reliability of confidence estimation.
            - heading "2 Problem and Analysis" [level=2] [ref=e6635]
            - paragraph [ref=e6636]:
              - text: In this section, we first formulate the LLM reasoning problem using sampling-based test-time scaling methods. Then, we theoretically decompose the LLM reasoning error into
              - emphasis [ref=e6637]: Estimation Error
              - text: and
              - emphasis [ref=e6638]: Model Error
              - text: ", and analyze two representative methods of consistency-based and probability-based methods. Our analysis reveals insights for building an advanced LLM reasoning method."
