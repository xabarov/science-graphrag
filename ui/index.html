<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>science-graphrag — Benchmarks</title>
    <style>
      /* Inline scroll-root reset: applied before any imported CSS / MUI CssBaseline
         so the document can never produce its own scrollbar. */
      html, body { height: 100%; margin: 0; overflow: hidden; }
      #root { position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- First-paint theme: keep trim + resolution in sync with ui/src/theme/appearanceMode.js (roadmap §10.5). -->
    <script>
      (function () {
        var KEY = "ui.appearanceMode";
        var raw = null;
        try {
          raw = localStorage.getItem(KEY);
        } catch (e) {
          raw = null;
        }
        var s = raw == null ? "" : String(raw).trim();
        var pref = s === "dark" || s === "light" || s === "system" ? s : "system";
        var dark = false;
        try {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e2) {
          dark = false;
        }
        var eff = pref === "dark" ? "dark" : pref === "light" ? "light" : dark ? "dark" : "light";
        document.documentElement.dataset.colorScheme = eff;
        document.documentElement.style.colorScheme = eff;
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
