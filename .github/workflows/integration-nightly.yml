# Neo4j + Qdrant + Postgres integration + benchmarks — не блокирует merge.
# Запуск: вручную (workflow_dispatch) или по расписанию (cron на default branch репозитория).
# См. docs/benchmarks/graph-level-eval-v1.md

name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: science
          POSTGRES_PASSWORD: science
          POSTGRES_DB: science_graphrag
        ports:
          - 5432:5432
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/sciencegraphrag
        ports:
          - 7687:7687
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333

    env:
      SCIENCE_GRAPHRAG_DATABASE_URL: postgresql+psycopg://science:science@postgres:5432/science_graphrag
      SCIENCE_GRAPHRAG_NEO4J_URI: bolt://neo4j:7687
      SCIENCE_GRAPHRAG_NEO4J_USER: neo4j
      SCIENCE_GRAPHRAG_NEO4J_PASSWORD: sciencegraphrag
      SCIENCE_GRAPHRAG_QDRANT_URL: http://qdrant:6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: pip install -e ".[dev,agent]"

      - name: Wait for services
        run: sleep 40

      - name: Integration tests (Neo4j + Qdrant + Postgres)
        run: pytest tests -m integration -q

      - name: Retrieval benchmark (merge_safe + strict_pilot, mock answers)
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "false"
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_API_KEY: ""
          API_KEY: ""
          MAIN_LLM_API_KEY: ""
        run: |
          python -m eval.retrieval.runner tests/fixtures/benchmarks/retrieval --suite --mock-answer \
            --json-out eval/results/ci-retrieval-merge-safe-mock.json
          python -m eval.retrieval.runner tests/fixtures/benchmarks/retrieval --suite --tier strict_pilot --mock-answer \
            --json-out eval/results/ci-retrieval-strict-pilot-mock.json

      - name: Layer-1 benchmark suite (heuristic, no LLM)
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "false"
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_API_KEY: ""
          API_KEY: ""
          MAIN_LLM_API_KEY: ""
        run: science-graphrag-layer1-benchmark tests/fixtures/benchmarks/layer1 --suite --json-out eval/results/ci-layer1-suite.json

      - name: Graph benchmark — yolov1 (ingest + Neo4j snapshot)
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "false"
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_API_KEY: ""
          API_KEY: ""
          MAIN_LLM_API_KEY: ""
        run: science-graphrag-graph-benchmark tests/fixtures/benchmarks/layer1/yolov1 --json-out eval/results/ci-graph-yolov1.json

      - name: Graph benchmark — retinanet_focal_realpdf (ingest + Neo4j snapshot)
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "false"
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_API_KEY: ""
          API_KEY: ""
          MAIN_LLM_API_KEY: ""
        run: science-graphrag-graph-benchmark tests/fixtures/benchmarks/layer1/retinanet_focal_realpdf --json-out eval/results/ci-graph-retinanet.json

      - name: Layer-2 semantic benchmark suite (merge_safe, no LLM)
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "false"
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_API_KEY: ""
          SCIENCE_GRAPHRAG_SEMANTIC_EXTRACTION_ENABLED: "true"
          API_KEY: ""
          MAIN_LLM_API_KEY: ""
        run: science-graphrag-layer2-benchmark tests/fixtures/benchmarks/layer2 --suite --tier merge_safe --json-out eval/results/ci-layer2-suite.json

      - name: Layer-2 nightly_semantic (optional, needs MAIN_LLM_API_KEY secret)
        if: ${{ secrets.MAIN_LLM_API_KEY != '' }}
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "true"
          MAIN_LLM_API_KEY: ${{ secrets.MAIN_LLM_API_KEY }}
        run: science-graphrag-layer2-benchmark tests/fixtures/benchmarks/layer2 --suite --tier nightly_semantic --json-out eval/results/ci-layer2-nightly-semantic.json

      - name: Layer-1 nightly_heavy (optional, needs MAIN_LLM_API_KEY secret)
        if: ${{ secrets.MAIN_LLM_API_KEY != '' }}
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "true"
          MAIN_LLM_API_KEY: ${{ secrets.MAIN_LLM_API_KEY }}
        run: science-graphrag-layer1-benchmark tests/fixtures/benchmarks/layer1 --suite --tier nightly_heavy --threshold-profile reporting_skip_f1_gates --json-out eval/results/ci-layer1-nightly-heavy-llm.json

      # BT3: multihop v2 needs live API + Neo4j graph (slug→UUID + view=raw in runner).
      # CI services have no uvicorn — default 8009 skips and writes ``multihop-skipped-*.json``.
      # Local/dev: ``--api-base-url http://127.0.0.1:18787`` (docker-compose.dev.yml api port).
      - name: Multihop v2 pilot (skip when API not available)
        run: |
          python -m eval.retrieval.multihop_runner \
            tests/fixtures/benchmarks/retrieval/multihop_v2 \
            --suite --tier multihop_v2_pilot \
            --api-base-url http://127.0.0.1:8009 \
            --allow-skip-on-infra \
            --json-out eval/results/ci-retrieval-multihop-mini.json

      - name: Aggregate benchmark metrics summary
        run: python scripts/aggregate_benchmark_metrics.py

      - name: Trust baseline regression guard
        run: |
          .venv/bin/python scripts/aggregate_benchmark_metrics.py
          .venv/bin/pytest tests/benchmarks/test_trust_baseline_regression.py -q

      - name: Upload benchmark JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci-json
          path: |
            eval/results/ci-*.json
            eval/results/benchmark-metrics-summary.json
          if-no-files-found: ignore
