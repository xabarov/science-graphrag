name: agent-sse-contract

on:
  pull_request:
    paths:
      - "science_graphrag/agent/**"
      - "science_graphrag/api/agent_v2.py"
      - "science_graphrag/api/agent_v2_modules/**"
      - "tests/test_api_agent_v2_*.py"
      - "tests/test_product_step_tool_coverage.py"
      - "tests/scripts/live_check/test_trace_review_schema.py"
      - "tests/scripts/live_check/test_agent_trace_review.py"

jobs:
  pytest-agent-stream-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (dev + agent extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent]"
      - name: Agent v2 SSE / product_step / trace-review schema
        run: |
          pytest \
            tests/test_api_agent_v2_smoke.py \
            tests/test_api_agent_v2_stream_parity.py \
            tests/test_api_agent_v2_product_step_coverage.py \
            tests/test_api_agent_v2_error_classification.py \
            tests/test_product_step_tool_coverage.py \
            tests/scripts/live_check/test_trace_review_schema.py \
            tests/scripts/live_check/test_agent_trace_review.py \
            tests/observability/test_agent_sse_stream_otel.py \
            -q
      - name: Trace regression compare (baseline sanity gate)
        run: |
          python scripts/live_check/trace_regression_compare.py \
            --baseline eval/results/baseline-trace-review.json \
            --candidate eval/results/trace-review-off.json \
            --warn-is-pass \
            --out-json eval/results/ci-trace-regression-compare.json \
            --out-md eval/results/ci-trace-regression-compare.md
      - name: Trace regression compare (strict policy report)
        run: |
          python scripts/live_check/trace_regression_compare.py \
            --baseline eval/results/baseline-trace-review.json \
            --candidate eval/results/trace-review-off.json \
            --out-json eval/results/ci-trace-regression-compare-strict.json \
            --out-md eval/results/ci-trace-regression-compare-strict.md
