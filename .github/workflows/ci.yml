# Merge gate: unit + smoke (no Docker services required).
# Integration: pytest -m integration — см. docs/benchmarks/graph-level-eval-v1.md (nightly/manual).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: Tests (exclude integration)
        run: pytest tests -m "not integration" -q

      - name: Layer-1 benchmark (merge_safe, no LLM)
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "false"
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_API_KEY: ""
          API_KEY: ""
          MAIN_LLM_API_KEY: ""
        run: science-graphrag-layer1-benchmark tests/fixtures/benchmarks/layer1 --suite --tier merge_safe

      - name: Layer-2 semantic benchmark (merge_safe, no LLM)
        env:
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_ENABLED: "false"
          SCIENCE_GRAPHRAG_EXTRACTION_LLM_API_KEY: ""
          API_KEY: ""
          MAIN_LLM_API_KEY: ""
        run: science-graphrag-layer2-benchmark tests/fixtures/benchmarks/layer2 --suite --tier merge_safe

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
