[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "science-graphrag"
version = "0.1.0"
description = "Scholarly GraphRAG: ingestion backbone, Neo4j graph, chunk vectors"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "neo4j>=5.26",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "qdrant-client>=1.12",
    "sqlalchemy>=2.0",
    "typer>=0.15",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
science-graphrag = "science_graphrag.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["science_graphrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Docker services (Neo4j, Postgres, Qdrant)",
]
